<div class="shell">
  <button type="button" class="skip-link" (click)="skipToContent()">Skip to content</button>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" routerLink="/">
        <strong>Clearplan</strong>
        <span>Finance planner</span>
      </a>
      <nav class="nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
        <a routerLink="/income" routerLinkActive="active">Income</a>
        <a routerLink="/spending" routerLinkActive="active">Spending</a>
        <a routerLink="/tools/take-home" routerLinkActive="active">Take-home</a>
      </nav>
    </div>
  </header>
  <main id="content" tabindex="-1">
    <router-outlet />
  </main>
  <footer class="site-footer">
    <div class="wrap">
      Slán go fóill (goodbye for now). Clearplan stores your plan in this browser. The Ireland
      take-home tool is an estimate, not cáin (tax) advice.
    </div>
  </footer>
</div>
